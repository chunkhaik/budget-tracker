apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: budget-tracker
  namespace: budget-tracker
spec:
  rules:
    - host: budget-tracker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
