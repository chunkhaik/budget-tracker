apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: budget-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: budget-tracker-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: budget-tracker-config
            - secretRef:
                name: budget-tracker-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: budget-tracker
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
