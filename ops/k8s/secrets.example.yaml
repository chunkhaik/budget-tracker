apiVersion: v1
kind: Secret
metadata:
  name: budget-tracker-secrets
  namespace: budget-tracker
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/budget_tracker
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  DEV_CURRENT_USER_ID: 00000000-0000-0000-0000-000000000001
  DEV_CURRENT_USER_EMAIL: dev-user@example.com
  DEV_CURRENT_USER_NAME: Dev User
